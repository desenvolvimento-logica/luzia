name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Valor-canário SINTÉTICO nos dois nomes de variável usados ao longo do projeto: o build o recebe e
      # check:bundle prova que ele não chega ao navegador.
      # Não é segredo e nunca deve ser trocado pela chave real.
      SUPABASE_SERVICE_ROLE_KEY: luzia-canario-nao-e-segredo
      SUPABASE_SECRET_KEY: luzia-canario-nao-e-segredo
      # Testes de navegador usam o Google Chrome já instalado no runner (channel: "chrome").
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run verify

      - name: Capturas de tela da interface
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interface
          path: test-results/visual/
          retention-days: 7
          if-no-files-found: ignore

      - name: Artefatos dos testes de navegador
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
